[platformio]
src_dir = main

[env:esp32-p4]
platform = espressif32
board = esp32-p4_r3
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
custom_sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.f_cpu = 400000000L
board_build.f_psram = 200000000L
build_flags =
    -O3
    -DCONFIG_EMU_RAM_MB=16
    -DCONFIG_EMU_CONSOLE_UART0=1
    -DCONFIG_EMU_CONSOLE_USB_JTAG=1
